name: CodeQL

# Replaces GitHub's default code scanning setup so that
# .github/codeql/codeql-config.yml can leave fixtures and generated files out.
# Turn default setup off (Settings > Code security > CodeQL analysis) before
# merging, or this workflow's uploads are rejected.
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    schedule:
        - cron: "17 3 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language:
                    - actions
                    - c-cpp
                    - javascript-typescript
                    - python
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  config-file: ./.github/codeql/codeql-config.yml

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: /language:${{ matrix.language }}
