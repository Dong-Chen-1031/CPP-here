name: Backend Docker Build & Push

on:
    push:
        branches:
            - main
        paths:
            - "backend/**"
            - "docker/**"
            - ".github/workflows/backend-docker.yml"
    pull_request:
        paths:
            - "backend/**"
            - "docker/**"
            - ".github/workflows/backend-docker.yml"
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: dong-chen-1031/cpp-here/backend

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build and push image by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/backend/Dockerfile
                  platforms: ${{ matrix.platform }}
                  push: true
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.platform }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest artifact
              uses: actions/upload-artifact@v4
              with:
                  name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        runs-on: ubuntu-latest
        needs: build
        # Waiting for the builder image can take minutes, so merge jobs of
        # consecutive commits would otherwise run side by side and the older
        # one could tag latest last. Queue them; the check further down also
        # covers jobs queued out of order.
        concurrency:
            group: backend-docker-merge-${{ github.ref }}
            cancel-in-progress: false
        permissions:
            contents: read
            packages: write
            pull-requests: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digest-*
                  merge-multiple: true

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=pr
                      type=sha,prefix=sha-

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # builder-docker.yml pushes the builder image this backend pins only
            # after its regression tests pass, which takes longer than this
            # build. Tag the backend once that image exists, so a deploy never
            # pulls a backend whose builder image isn't there (every build would
            # fail); give up if it never shows up (the builder tests failed).
            - name: Wait for the pinned builder image
              run: |
                  ref=$(grep -oE '^BUILDER_IMAGE = "[^"]+"' backend/services/build.py | cut -d'"' -f2)
                  [ -n "$ref" ] || { echo "BUILDER_IMAGE not found in backend/services/build.py" >&2; exit 1; }
                  for _ in $(seq 40); do
                      if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
                          echo "$ref exists"
                          exit 0
                      elif ! grep -qi 'not found' <<< "$out"; then
                          echo "$out" >&2
                          exit 1
                      fi
                      echo "Waiting for $ref ..."
                      sleep 30
                  done
                  echo "::error::$ref was not pushed within 20 minutes (did builder-docker.yml fail?)"
                  exit 1

            # latest and pr-N follow the newest commit. If the branch or PR has
            # moved on while this job waited, its run tags them instead; this
            # one only pushes its own sha- tag.
            - name: Check that this is still the newest commit
              id: newest
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ "${{ github.event_name }}" = pull_request ]; then
                      mine=${{ github.event.pull_request.head.sha }}
                      head=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)
                  else
                      mine=$GITHUB_SHA
                      head=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
                  fi
                  if [ "$head" = "$mine" ]; then
                      echo "newest=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::$GITHUB_REF is now at $head, not $mine: only pushing the sha- tag"
                      echo "newest=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create and push multi-platform manifest
              working-directory: /tmp/digests
              env:
                  NEWEST: ${{ steps.newest.outputs.newest }}
              run: |
                  docker buildx imagetools create \
                    $(jq -cr --arg newest "$NEWEST" '.tags | map(select($newest == "true" or contains(":sha-"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

            - name: Inspect final manifest
              run: |
                  docker buildx imagetools inspect "$(jq -r '.tags[] | select(contains(":sha-"))' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
