name: Builder Docker Build, Test & Push

# The image the backend compiles user code in (builder/). Tagged with the git
# tree hash of builder/docker, which is known before merging, so a PR can pin
# the new tag in backend/services/build.py itself (checked by ci.yml).

on:
    push:
        branches:
            - main
        paths:
            - "builder/**"
            - "backend/assets/worker.js"
            - "backend/utils/stdcxx.py"
            - "frontend/src/config/runLimits.ts"
            - ".github/workflows/builder-docker.yml"
    pull_request:
        paths:
            - "builder/**"
            - "backend/assets/worker.js"
            - "backend/utils/stdcxx.py"
            - "frontend/src/config/runLimits.ts"
            - ".github/workflows/builder-docker.yml"
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: dong-chen-1031/safe-cpp2wasm
    # Pushed for main and for pull requests from this repository (not forks),
    # so a PR's backend image (backend-docker.yml pushes pr-N) can pull the
    # builder tag it pins. A tree-<hash> tag is written once and never moved
    # (see the merge job), so pushing it early is safe; latest only moves on main.
    PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        # Both legs give the same hash; the merge job queues on it
        outputs:
            tree: ${{ steps.tree.outputs.hash }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Tree hash of builder/docker
              id: tree
              run: echo "hash=$(git rev-parse --short=12 HEAD:builder/docker)" >> "$GITHUB_OUTPUT"

            - name: Log in to GitHub Container Registry
              if: ${{ env.PUSH == 'true' }}
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Build into the local Docker daemon first so the regression test
            # runs against exactly this platform's image before anything is pushed
            - name: Build image for testing
              uses: docker/build-push-action@v6
              with:
                  context: ./builder/docker
                  platforms: ${{ matrix.platform }}
                  load: true
                  tags: safe-cpp2wasm:test
                  cache-from: type=gha,scope=builder-${{ matrix.platform }}
                  cache-to: type=gha,mode=max,scope=builder-${{ matrix.platform }}

            - name: Regression test
              run: builder/test/regression/run.sh safe-cpp2wasm:test

            # When tree-<hash> already exists the merge job only re-tags it (see
            # there), so pushing this build would just leave an untagged
            # manifest behind in the registry
            - name: Look for an existing tree-<hash> image
              if: ${{ env.PUSH == 'true' }}
              id: existing
              run: |
                  ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tree-${{ steps.tree.outputs.hash }}
                  if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
                      echo "$ref exists, not pushing this build"
                      echo "ref=$ref" >> "$GITHUB_OUTPUT"
                  elif ! grep -qi 'not found' <<< "$out"; then
                      echo "$out" >&2
                      exit 1
                  fi

            # Same inputs as the test build, so every layer comes from the cache
            - name: Build and push image by digest
              if: ${{ env.PUSH == 'true' && steps.existing.outputs.ref == '' }}
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: ./builder/docker
                  platforms: ${{ matrix.platform }}
                  push: true
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=builder-${{ matrix.platform }}
                  cache-to: type=gha,mode=max,scope=builder-${{ matrix.platform }}

            - name: Export digest
              if: ${{ env.PUSH == 'true' && steps.existing.outputs.ref == '' }}
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest artifact
              if: ${{ env.PUSH == 'true' && steps.existing.outputs.ref == '' }}
              uses: actions/upload-artifact@v4
              with:
                  name: builder-digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        runs-on: ubuntu-latest
        needs: build
        # Same condition as env.PUSH (the env context isn't available here)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # The tree-<hash> check below and the push after it are not atomic: two
        # runs with the same builder/docker (a follow-up commit, a re-run, a PR
        # and main after merging it, a workflow_dispatch) could both see no tag
        # and the later one would move it. They queue on the tree hash, from
        # every ref; runs with a different tree don't wait. GitHub keeps one
        # pending run per group, so a third run of the same tree within a merge
        # replaces the pending one, which then skips its own latest / sha- /
        # pr- tags (rare: a merge takes seconds).
        concurrency:
            group: builder-docker-tree-${{ needs.build.outputs.tree }}
            cancel-in-progress: false
        permissions:
            contents: read
            packages: write

        steps:
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=raw,value=tree-${{ needs.build.outputs.tree }}
                      type=ref,event=pr
                      type=sha,prefix=sha-

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # tree-<hash> is what the backend pins and part of its build cache
            # key (BuildRequest.hash()), so it must never point at a different
            # image. Runs with an unchanged builder/docker (a test or README
            # change, a re-run) would rebuild something that can still differ
            # (unpinned base image and apt packages, labels), so they tag the
            # existing image instead of the one they just built.
            - name: Look for an existing tree-<hash> image
              id: existing
              run: |
                  ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tree-${{ needs.build.outputs.tree }}
                  if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
                      echo "Reusing $ref"
                      echo "ref=$ref" >> "$GITHUB_OUTPUT"
                  elif ! grep -qi 'not found' <<< "$out"; then
                      echo "$out" >&2
                      exit 1
                  fi

            # The build jobs only push digests when the tag didn't exist yet
            - name: Download digests
              if: ${{ steps.existing.outputs.ref == '' }}
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: builder-digest-*
                  merge-multiple: true

            - name: Create and push multi-platform manifest
              env:
                  EXISTING: ${{ steps.existing.outputs.ref }}
              run: |
                  if [ -n "$EXISTING" ]; then
                      tags=$(jq -cr --arg t "$EXISTING" '.tags | map(select(. != $t) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
                      sources=$EXISTING
                  else
                      tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
                      sources=$(cd /tmp/digests && printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
                  fi
                  docker buildx imagetools create $tags $sources

            # Every tag above was created from the same source in one command, so
            # tree-<hash> must still point where this run's sha- tag does. If
            # anything moved it anyway, fail instead of letting it go unnoticed.
            - name: Check that tree-<hash> wasn't moved
              run: |
                  digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
                  tree=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tree-${{ needs.build.outputs.tree }}
                  sha=$(jq -r '.tags[] | select(contains(":sha-"))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
                  docker buildx imagetools inspect "$tree"
                  if [ "$(digest "$tree")" != "$(digest "$sha")" ]; then
                      echo "::error::$tree no longer points at what this run tagged ($sha)"
                      exit 1
                  fi
