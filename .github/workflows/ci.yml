name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

jobs:
    backend:
        name: Backend lint, type check & import smoke test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: backend/requirements.txt

            - name: Install dependencies
              working-directory: backend
              run: |
                  python -m pip install --upgrade pip
                  # Pinned: an unpinned Ruff means a new release can enable new
                  # default rules and fail CI on code that did not change.
                  # Keep in sync with .lintstagedrc.mjs and the root `format` script.
                  pip install -r requirements.txt 'ruff==0.14.13' 'ty==0.0.83'

            - name: Lint
              working-directory: backend
              run: ruff check .

            - name: Format check
              working-directory: backend
              run: ruff format --check .

            - name: Type check
              working-directory: backend
              run: ty check --python "$(which python)"

            - name: Import smoke test
              working-directory: backend
              run: |
                  mkdir -p cache logs
                  python -c "import main"

    builder-pin:
        name: Builder image pin matches builder/docker
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # The builder image is tagged with the tree hash of builder/docker
            # (builder-docker.yml), so a change to the image must update the pin
            # in the same commit, or the backend would keep running the old one
            - name: Check pins
              run: |
                  expected="ghcr.io/dong-chen-1031/safe-cpp2wasm:tree-$(git rev-parse --short=12 HEAD:builder/docker)"
                  status=0
                  for file in backend/services/build.py docker/docker-compose.yml docker/backend/docker-compose.yml; do
                      if ! grep -qF "$expected" "$file"; then
                          echo "::error file=$file::builder image pin is not $expected"
                          status=1
                      fi
                  done
                  exit $status

    frontend:
        name: Frontend format & type check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format check
              run: bun run format:check

            - name: Copy i18n resources
              run: bun run copy-i18n

            - name: Type check
              working-directory: frontend
              # `wrangler types` first, same as the build script: it generates
              # worker-configuration.d.ts, which is not committed.
              run: |
                  bunx wrangler types
                  bunx astro check
