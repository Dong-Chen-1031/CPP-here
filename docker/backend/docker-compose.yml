services:
  backend:
    image: ghcr.io/dong-chen-1031/cpp-here/backend:latest
    environment:
      - HOST_CACHE_PATH=${PWD}/cache
        # this env tell the backend the cache path on the host machine. 
        # So when it starts sub containers for wasm builds, it can mount the same cache path to speed up builds and share cache between host and containers.

      - DEV_MODE=false
        # set to false for production deployment, true for local development
        # If DEV_MODE is false, it will stop auto reloading and turn off api docs.
        # Default: false

      - PORT=8000
        # Port for the backend server to listen on. 
        # Default: 8000

      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-4321}
        # Frontend URL for CORS configuration. 
        # Default: "http://localhost:4321"

      - BACKEND_URL=http://localhost:${BACKEND_PORT:-8000}
        # Public URL of the backend, as seen by the browser.
        # Build results link to "${BACKEND_URL}/cache/<id>/build.wasm", which the browser downloads directly,
        # so use the host port (see BACKEND_PORT) or your public domain, not "http://backend:8000".
        # Default: "http://localhost:8000"

      - TURNSTILE_SECRET=1x0000000000000000000000000000000AA
        # Cloudflare Turnstile secret key, used by POST /api/verify.
        # Must pair with the frontend's PUBLIC_TURNSTILE_SITE_KEY.
        # Get a real secret key from Cloudflare Turnstile dashboard for production use.
        # "1x0000000000000000000000000000000AA" always passes and is meant for development.

      - JWT_SECRET=
        # A secure random string used for signing JWT tokens. Generate one with: openssl rand -base64 32
        # In production, make sure to set this to a strong, unique value and keep it secret.
        # Default: not set (a random secret is generated on every start, so restarts log every user out).

      - BYPASS_CAPTCHA=false
        # Set to true to skip token checks on /api/build and /api/share. For local testing only.
        # Must be true whenever the frontend has PUBLIC_BYPASS_CAPTCHA=true, since the frontend then sends no token.
        # Default: false

      - SHARE=false
        # Whether to enable POST /api/share. It stays disabled unless all four S3_* values below are set.
        # The frontend also needs PUBLIC_SHARE, PUBLIC_S3_BUCKET_URL and PUBLIC_S3_BUCKET_NAME.
        # Default: false

      - S3_ENDPOINT_URL=
      - S3_ACCESS_KEY_ID=
      - S3_SECRET_ACCESS_KEY=
      - S3_BUCKET_NAME=
        # S3-compatible storage for shared code (AWS S3, Cloudflare R2, MinIO, ...).
        # Objects are stored at "<S3_BUCKET_NAME>/share/<share id>" and must be publicly readable.

      - COLUMNS=160
        # how wide your terminal is.
        # This is used to format the output of the backend server logs to prevent line breaks in the middle of log lines when running in Docker Compose.

      - DOCKER_WORKER_TTL=1800
        # Seconds a build worker container lives before killing itself.
        # This is the backstop for ungraceful shutdowns (SIGKILL / OOM / host reboot):
        # workers left behind by a dead backend disappear on their own within this window.
        # Default: 1800

      - DOCKER_ORPHAN_SWEEP=true
        # Delete leftover workers from a previous run when the backend starts.
        # Set to false if several backends share one Docker daemon, since the sweep
        # cannot tell a dead instance's workers from a live sibling's.
        # Default: true

      # More settings (DOCKER_POOL_SIZE, CACHE_LIMIT, POSTHOG_API_KEY, ...) are listed in backend/.env.example.

    # or use .env to set environment variables:
    # env_file: .env

    ports:
      - "${BACKEND_PORT:-8000}:8000"
      # Host port for the backend. The container always listens on 8000 (see PORT above),
      # so set BACKEND_PORT to change the port on your machine.
      # Backend and frontend must not share one variable, or both would try to bind it.

    volumes:
      - ./cache:/app/cache
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount Docker socket for DinD (Docker-in-Docker) to allow backend to manage Docker containers for wasm builds.

    stop_grace_period: 30s
    # The default 10s can expire while the backend is still removing its worker
    # containers, turning a normal `docker compose down` into a SIGKILL that leaks them.

    restart: unless-stopped

  wasm-builder:
    image: ghcr.io/dong-chen-1031/safe-cpp2wasm:latest
    entrypoint: ["true"]
    restart: "no"
    # This service exists only to pre-pull the wasm builder image onto the host,
    # so the backend can spawn it as a sub-container for wasm builds.
